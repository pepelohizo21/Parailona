Я знаю, що ти вже багато разів чула від мене, як сильно я тебе люблю, але навіть якби я повторював це тисячу разів, мені все одно хотілося б сказати ще раз. Ахахах, тож не сподівайся, що я колись перестану тобі це нагадувати.

Дякую тобі за ці п’ять місяців і за те, що ти є в моєму житті. Я сподіваюся, що попереду в нас буде ще багато щасливих моментів, розмов і приводів усміхатися

З нашими п’ятьма місяцями, моя jefita
Ти мені дуже дорога, і я люблю тебе більше, ніж іноді можу висловити словами. І пам’ятай: скільки б разів я тобі це не казав, мені ніколи не набридне.`;

    const q=pet[i];q.age+=dt;q.vy+=q.g*dt;q.x+=(q.vx+Math.sin(q.age*2+q.ph)*q.sw)*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;
    if(q.y>gy+q.dg){q.y=gy+q.dg;q.vy=0;q.vx=0;q.g=0;q.sw=0;q.vr=0}
    const al=q.age>q.max?1-(q.age-q.max)/1.5:1;
    if(al<=0){pet.splice(i,1);continue}
    heart(x,q.x,q.y,q.s,q.r,q.c,al*.9);
  }
  if(!typed&&t>6.5){typed=true;type()}
  if(t>8)K.style.opacity=1;
  requestAnimationFrame(frame);
}
build();cnt();setInterval(cnt,1000);requestAnimationFrame(frame);
